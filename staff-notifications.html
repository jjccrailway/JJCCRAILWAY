<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Notifications | JJCC Railways</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#102044;--gold:#d18408;--cream:#f5f3ee;--ink:#172440;--muted:#77766f;--line:#e5e3de}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--navy);color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:white;text-decoration:none;border:1px solid #ffffff66;padding:10px 14px;border-radius:7px}main{max-width:1000px;width:92%;margin:32px auto}.panel,.item{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}.item.unread{border-left:4px solid var(--gold)}.item h3{margin:0 0 8px}.muted{color:var(--muted)}button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:white}.status{padding:12px;background:#fff2d7;border-radius:7px}</style></head><body><header><strong>JJCC RAILWAYS | STAFF NOTIFICATIONS</strong><a id="back" href="admin.html">Back to Dashboard</a></header><main><h1>Staff Notifications</h1><p class="muted">New discount ID and passenger payment submissions for your staff role.</p><section class="panel"><button id="refresh">Refresh</button><p id="message" class="status">Loading…</p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const URL='https://ocjyyfzuoiprwajwyize.supabase.co',KEY='sb_publishable_XZu8suOKCWB9Zp7dYhzxgQ_Yaq5zxo8',db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s);let role='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,e=false){$('#message').textContent=t;$('#message').style.color=e?'#a52c2c':''}async function init(){try{const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){location.replace('index.html');return}const r=await db.rpc('current_user_role');if(r.error)throw r.error;role=r.data;if(!['admin','super_admin'].includes(role)){location.replace('book.html');return}if(role==='super_admin')$('#back').href='superadmin.html';await load()}catch(e){msg(e.message||'Unable to load notifications.',true)}}async function load(){msg('Loading notifications…');const {data,error}=await db.from('staff_notifications').select('notification_id,booking_id,title,message,is_read,created_at').eq('recipient_role',role).order('created_at',{ascending:false}).limit(100);if(error)throw error;$('#list').innerHTML=(data||[]).length?data.map(n=>`<article class="item ${n.is_read?'':'unread'}"><h3>${esc(n.title)}</h3><p>${esc(n.message)}</p><p class="muted">${new Date(n.created_at).toLocaleString('en-PH')} · ${n.is_read?'Read':'Unread'}</p>${!n.is_read?`<button data-read="${n.notification_id}">Mark as read</button>`:''}</article>`).join(''):'<p>No staff notifications yet.</p>';msg('Notifications updated.')}$('#refresh').addEventListener('click',()=>load().catch(e=>msg(e.message,true)));$('#list').addEventListener('click',async e=>{const b=e.target.closest('[data-read]');if(!b)return;const {error}=await db.from('staff_notifications').update({is_read:true}).eq('notification_id',Number(b.dataset.read)).eq('recipient_role',role);if(error)msg(error.message,true);else load().catch(x=>msg(x.message,true))});init()})();</script></body></html>
