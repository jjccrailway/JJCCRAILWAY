<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount ID Review | JJCC Railways</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#102044;--gold:#d18408;--cream:#f5f3ee;--ink:#172440;--muted:#77766f;--line:#e5e3de}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--navy);color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:10px 14px;border-radius:7px}main{width:92%;max-width:1200px;margin:32px auto}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}select,textarea,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:7px}button{cursor:pointer;font-weight:700}.approve{background:#187443;color:white}.reject{background:#a52c2c;color:white}.open{background:var(--navy);color:white}.item{display:grid;grid-template-columns:1fr auto;gap:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions textarea{width:100%;min-height:58px}.status{padding:12px;background:#fff2d7;border-radius:7px}.muted{color:var(--muted)}@media(max-width:700px){.item{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="admin-theme.css">
</head><body><header><strong>JJCC RAILWAYS | DISCOUNT ID REVIEW</strong><a id="back" href="admin.html">Back to Dashboard</a></header><main><h1>Discount ID Verification</h1><p class="muted">Review Student, Senior Citizen, and PWD ID submissions. Both Admin and Super Admin may approve or reject.</p><section class="panel"><div class="toolbar"><select id="filter"><option value="pending_review">Pending review</option><option value="all">All submissions</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refresh">Refresh</button></div><p id="message" class="status">Loading…</p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const URL='https://ocjyyfzuoiprwajwyize.supabase.co',KEY='sb_publishable_XZu8suOKCWB9Zp7dYhzxgQ_Yaq5zxo8',db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s);let rows=[],bookingMap=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,e=false){$('#message').textContent=t;$('#message').style.color=e?'#a52c2c':''}async function init(){try{const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){location.replace('index.html');return}const {data:role,error:re}=await db.rpc('current_user_role');if(re)throw re;if(!['admin','super_admin'].includes(role)){location.replace('book.html');return}if(role==='super_admin')$('#back').href='superadmin.html';await load()}catch(e){msg(e.message,true)}}async function load(){msg('Loading ID submissions…');const {data:bookingRows,error:bookingError}=await db.rpc('get_staff_booking_records');if(bookingError)throw bookingError;bookingMap=new Map((bookingRows||[]).map(x=>{const b=x.booking||x;return [String(b.booking_id),b]}));const {data,error}=await db.from('discount_id_submissions').select('discount_submission_id,booking_id,passenger_id,user_id,id_path,claimed_type,status,admin_note,submitted_at,booking:bookings(booking_reference),passenger:passengers(full_name)').order('submitted_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const f=$('#filter').value,shown=rows.filter(x=>f==='all'||x.status===f);$('#list').innerHTML=shown.length?shown.map(x=>`<article class="item"><div><strong>${esc(x.passenger?.full_name||'Passenger')} · ${esc(x.claimed_type.toUpperCase())}</strong><p><strong>Destination:</strong> ${esc(bookingMap.get(String(x.booking_id))?.arrival_station||'—')} · <strong>Route:</strong> ${esc(bookingMap.get(String(x.booking_id))?.departure_station||'—')} → ${esc(bookingMap.get(String(x.booking_id))?.arrival_station||'—')}</p><p>Booking: ${esc(x.booking?.booking_reference||x.booking_id)} · Passenger ID: ${x.passenger_id}</p><small class="muted">${new Date(x.submitted_at).toLocaleString('en-PH')} · ${esc(x.status)}</small><p>${esc(x.admin_note||'')}</p><div class="actions"><button class="open" data-open="${x.discount_submission_id}">View uploaded ID</button></div><textarea id="note-${x.discount_submission_id}" placeholder="Optional review note">${esc(x.admin_note||'')}</textarea></div><div class="actions">${x.status==='pending_review'?`<button class="approve" data-review="approved" data-id="${x.discount_submission_id}">Approve</button><button class="reject" data-review="rejected" data-id="${x.discount_submission_id}">Reject</button>`:''}</div></article>`).join(''):'<p>No submissions in this filter.</p>'}$('#filter').addEventListener('change',render);$('#refresh').addEventListener('click',()=>load().catch(e=>msg(e.message,true)));$('#list').addEventListener('click',async e=>{try{const open=e.target.closest('[data-open]'),review=e.target.closest('[data-review]');if(open){const x=rows.find(r=>r.discount_submission_id===Number(open.dataset.open));const {data,error}=await db.storage.from('discount-ids').createSignedUrl(x.id_path,300);if(error)throw error;window.open(data.signedUrl,'_blank','noopener')}if(review){const id=Number(review.dataset.id),decision=review.dataset.review,note=$('#note-'+id).value.trim();if(!confirm(`Are you sure you want to ${decision} this ID?`))return;review.disabled=true;const {data,error}=await db.rpc('review_discount_id_submission',{p_submission_id:id,p_decision:decision,p_admin_note:note||null});if(error)throw error;if(!data?.success)throw new Error('Decision was not saved.');msg(`ID ${decision}. Passenger notification created.`);await load()}}catch(err){msg(err.message||'Unable to review ID.',true)}});init()})();</script><script src="staff-shell.js"></script>
</body></html>
